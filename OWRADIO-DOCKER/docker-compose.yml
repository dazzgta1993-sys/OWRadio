version: '3.8'

services:
  musicbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: owradio:latest
    container_name: smart-music-bot
    restart: unless-stopped
    depends_on:
      - bgutil-provider
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/api/nowplaying"]
      interval: 30s
      timeout: 10s
      retries: 3

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
